name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build from clean
        run: make re

      - name: Build and self-sign the victim
        run: make victim

      - name: Smoke tests
        run: ./tests/smoke.sh

      - name: Package
        id: package
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          dist="memory_inspector-${version}-arm64-macos"
          mkdir -p "dist/${dist}"
          cp memory_inspector README.md victim/ent.plist "dist/${dist}/"
          tar -C dist -czf "dist/${dist}.tar.gz" "${dist}"
          shasum -a 256 "dist/${dist}.tar.gz" | tee "dist/${dist}.tar.gz.sha256"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          {
            echo 'Built on macOS arm64 (Apple Silicon).'
            echo
            echo 'The binary is ad-hoc signed only, so Gatekeeper quarantines it'
            echo 'after download. Clear the flag before running:'
            echo
            echo '    xattr -d com.apple.quarantine memory_inspector'
            echo
            echo '`task_for_pid` still requires the target to be signed with'
            echo '`com.apple.security.get-task-allow` and owned by the same uid,'
            echo 'unless you run as root. See the README.'
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.package.outputs.version }}" \
            --title "${{ steps.package.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*.tar.gz dist/*.sha256
